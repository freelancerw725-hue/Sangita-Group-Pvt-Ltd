<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sangita OS - AI Brain Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #e4e4e7;
      overflow: hidden;
    }
    
    #container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }
    
    #sidebar {
      width: 320px;
      background: #18181b;
      border-right: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    #graph-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    
    #header {
      padding: 20px;
      border-bottom: 1px solid #27272a;
    }
    
    #header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    #header p {
      font-size: 12px;
      color: #71717a;
    }
    
    #controls {
      padding: 16px;
      border-bottom: 1px solid #27272a;
    }
    
    .control-group {
      margin-bottom: 12px;
    }
    
    .control-group label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    
    input, select {
      width: 100%;
      padding: 8px 12px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      color: #e4e4e7;
      font-size: 13px;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
    }
    
    button {
      width: 100%;
      padding: 8px 12px;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #2563eb;
    }
    
    button.secondary {
      background: #27272a;
      color: #e4e4e7;
    }
    
    button.secondary:hover {
      background: #3f3f46;
    }
    
    #stats {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }
    
    .stat-card {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    
    .stat-card h3 {
      font-size: 11px;
      font-weight: 500;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 6px;
    }
    
    .stat-row:last-child {
      margin-bottom: 0;
    }
    
    .stat-label {
      color: #a1a1aa;
    }
    
    .stat-value {
      font-weight: 600;
      color: #e4e4e7;
    }
    
    .stat-value.success {
      color: #10b981;
    }
    
    .stat-value.error {
      color: #ef4444;
    }
    
    .stat-value.warning {
      color: #f59e0b;
    }
    
    #graph {
      width: 100%;
      height: 100%;
    }
    
    .node {
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .node:hover {
      stroke-width: 3px;
    }
    
    .node.selected {
      stroke-width: 4px;
      stroke: #3b82f6 !important;
    }
    
    .node.dimmed {
      opacity: 0.2;
    }
    
    .link {
      stroke: #3f3f46;
      stroke-opacity: 0.4;
      stroke-width: 1;
      fill: none;
      transition: all 0.2s;
    }
    
    .link.highlighted {
      stroke: #3b82f6;
      stroke-opacity: 0.8;
      stroke-width: 2;
    }
    
    .link.dimmed {
      opacity: 0.1;
    }
    
    .node-label {
      font-size: 10px;
      fill: #a1a1aa;
      pointer-events: none;
      text-anchor: middle;
    }
    
    .node-label.highlighted {
      fill: #e4e4e7;
      font-weight: 600;
    }
    
    #tooltip {
      position: absolute;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      max-width: 300px;
      font-size: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }
    
    #tooltip.show {
      opacity: 1;
    }
    
    #tooltip h4 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e4e4e7;
    }
    
    #tooltip p {
      margin-bottom: 4px;
      color: #a1a1aa;
    }
    
    #tooltip .badge {
      display: inline-block;
      padding: 2px 6px;
      background: #27272a;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 500;
      margin-right: 4px;
      margin-top: 4px;
    }
    
    #legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: #18181bb3;
      backdrop-filter: blur(10px);
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 12px;
      font-size: 11px;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    
    .legend-item:last-child {
      margin-bottom: 0;
    }
    
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }
    
    .feature-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    
    .feature-pill {
      padding: 6px 12px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .feature-pill:hover {
      background: #3f3f46;
      border-color: #3b82f6;
    }
    
    .feature-pill.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
    }
    
    #zoom-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
    }
    
    .zoom-btn {
      width: 36px;
      height: 36px;
      background: #18181bb3;
      backdrop-filter: blur(10px);
      border: 1px solid #3f3f46;
      border-radius: 6px;
      color: #e4e4e7;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .zoom-btn:hover {
      background: #27272a;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="sidebar">
      <div id="header">
        <h1>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1 2 2 0 0 1-2 2h-1v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3H3a2 2 0 0 1-2-2 1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/>
          </svg>
          AI Brain Graph
        </h1>
        <p>Sangita OS Architecture</p>
      </div>
      
      <div id="controls">
        <div class="control-group">
          <label>Search Files</label>
          <input type="text" id="search" placeholder="Type to search...">
        </div>
        
        <div class="control-group">
          <label>Filter by Type</label>
          <select id="filter-type">
            <option value="all">All Types</option>
            <option value="route">Routes</option>
            <option value="api">API Endpoints</option>
            <option value="component">Components</option>
            <option value="service">Services</option>
            <option value="migration">Migrations</option>
            <option value="test">Tests</option>
          </select>
        </div>
        
        <div class="control-group">
          <label>Focus on Feature</label>
          <div class="feature-pills" id="feature-pills"></div>
        </div>
        
        <button id="reset-view">Reset View</button>
        <button id="trace-deps" class="secondary" style="margin-top: 8px;">Trace Dependencies</button>
      </div>
      
      <div id="stats">
        <div class="stat-card">
          <h3>Project Stats</h3>
          <div class="stat-row">
            <span class="stat-label">Total Files</span>
            <span class="stat-value" id="stat-files">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Routes</span>
            <span class="stat-value" id="stat-routes">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">API Endpoints</span>
            <span class="stat-value" id="stat-apis">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Components</span>
            <span class="stat-value" id="stat-components">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Services</span>
            <span class="stat-value" id="stat-services">0</span>
          </div>
        </div>
        
        <div class="stat-card">
          <h3>Graph Stats</h3>
          <div class="stat-row">
            <span class="stat-label">Nodes</span>
            <span class="stat-value" id="stat-nodes">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Dependencies</span>
            <span class="stat-value" id="stat-edges">0</span>
          </div>
        </div>
        
        <div class="stat-card">
          <h3>Health Status</h3>
          <div class="stat-row">
            <span class="stat-label">Tests Passing</span>
            <span class="stat-value success" id="stat-tests">91/91</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Migrations</span>
            <span class="stat-value success" id="stat-migrations">3</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Errors</span>
            <span class="stat-value error" id="stat-errors">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Warnings</span>
            <span class="stat-value warning" id="stat-warnings">0</span>
          </div>
        </div>
      </div>
    </div>
    
    <div id="graph-container">
      <svg id="graph"></svg>
      <div id="tooltip"></div>
      <div id="zoom-controls">
        <div class="zoom-btn" id="zoom-in">+</div>
        <div class="zoom-btn" id="zoom-out">−</div>
        <div class="zoom-btn" id="zoom-fit">⊡</div>
      </div>
      <div id="legend">
        <div class="legend-item">
          <div class="legend-color" style="background: #3b82f6;"></div>
          <span>Routes</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #10b981;"></div>
          <span>API Endpoints</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #8b5cf6;"></div>
          <span>Components</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #f59e0b;"></div>
          <span>Services</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #06b6d4;"></div>
          <span>Migrations</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #ef4444;"></div>
          <span>Tests</span>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    let graphData = null;
    let simulation = null;
    let nodes = [];
    let links = [];
    let selectedNode = null;
    let selectedFeature = null;
    
    const colorMap = {
      'route': '#3b82f6',
      'api': '#10b981',
      'component': '#8b5cf6',
      'service': '#f59e0b',
      'migration': '#06b6d4',
      'test': '#ef4444',
      'file': '#71717a'
    };
    
    // Load graph data
    fetch('brain-graph.json')
      .then(res => res.json())
      .then(data => {
        graphData = data;
        initializeGraph();
        updateStats();
        initializeFeaturePills();
      })
      .catch(err => console.error('Failed to load brain graph:', err));
    
    function initializeGraph() {
      nodes = Object.values(graphData.nodes).map(n => ({...n}));
      links = graphData.edges.map(e => ({
        source: e.from,
        target: e.to,
        type: e.type
      }));
      
      createVisualization();
    }
    
    function createVisualization() {
      const container = document.getElementById('graph-container');
      const width = container.clientWidth;
      const height = container.clientHeight;
      
      const svg = d3.select('#graph')
        .attr('width', width)
        .attr('height', height);
      
      svg.selectAll('*').remove();
      
      const g = svg.append('g');
      
      // Create simulation
      simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(d => d.id).distance(50))
        .force('charge', d3.forceManyBody().strength(-300))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(20));
      
      // Create links
      const link = g.append('g')
        .selectAll('line')
        .data(links)
        .join('line')
        .attr('class', 'link');
      
      // Create nodes
      const node = g.append('g')
        .selectAll('circle')
        .data(nodes)
        .join('circle')
        .attr('class', 'node')
        .attr('r', d => Math.max(5, Math.min(15, d.exports.length + 5)))
        .attr('fill', d => colorMap[d.type] || colorMap['file'])
        .attr('stroke', d => d.features.hasError ? '#ef4444' : '#3f3f46')
        .attr('stroke-width', d => d.features.hasError ? 2 : 1)
        .call(drag(simulation))
        .on('click', handleNodeClick)
        .on('mouseover', handleNodeHover)
        .on('mouseout', handleNodeOut);
      
      // Create labels (only for important nodes)
      const label = g.append('g')
        .selectAll('text')
        .data(nodes.filter(d => d.type !== 'file' || d.exports.length > 3))
        .join('text')
        .attr('class', 'node-label')
        .attr('dy', 20)
        .text(d => d.name.replace(/\.(ts|tsx|js|jsx)$/, ''));
      
      // Zoom behavior
      const zoom = d3.zoom()
        .scaleExtent([0.1, 4])
        .on('zoom', (event) => {
          g.attr('transform', event.transform);
        });
      
      svg.call(zoom);
      
      // Store for later access
      svg.node().__data__ = { node, link, label, zoom, g };
      
      // Simulation tick
      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);
        
        node
          .attr('cx', d => d.x)
          .attr('cy', d => d.y);
        
        label
          .attr('x', d => d.x)
          .attr('y', d => d.y);
      });
      
      // Zoom controls
      document.getElementById('zoom-in').onclick = () => {
        svg.transition().call(zoom.scaleBy, 1.3);
      };
      
      document.getElementById('zoom-out').onclick = () => {
        svg.transition().call(zoom.scaleBy, 0.7);
      };
      
      document.getElementById('zoom-fit').onclick = () => {
        svg.transition().call(zoom.transform, d3.zoomIdentity);
      };
    }
    
    function drag(simulation) {
      function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
      }
      
      function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      }
      
      function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
      }
      
      return d3.drag()
        .on('start', dragstarted)
        .on('drag', dragged)
        .on('end', dragended);
    }
    
    function handleNodeClick(event, d) {
      selectedNode = d;
      highlightNode(d);
      showNodeDetails(d);
    }
    
    function handleNodeHover(event, d) {
      showTooltip(event, d);
    }
    
    function handleNodeOut() {
      hideTooltip();
    }
    
    function highlightNode(node) {
      const svg = d3.select('#graph');
      const data = svg.node().__data__;
      
      // Get connected nodes
      const connected = new Set([node.id]);
      links.forEach(l => {
        if (l.source.id === node.id) connected.add(l.target.id);
        if (l.target.id === node.id) connected.add(l.source.id);
      });
      
      // Highlight
      data.node
        .classed('selected', d => d.id === node.id)
        .classed('dimmed', d => !connected.has(d.id));
      
      data.link
        .classed('highlighted', l => l.source.id === node.id || l.target.id === node.id)
        .classed('dimmed', l => l.source.id !== node.id && l.target.id !== node.id);
      
      data.label
        .classed('highlighted', d => connected.has(d.id));
    }
    
    function showTooltip(event, d) {
      const tooltip = document.getElementById('tooltip');
      tooltip.innerHTML = `
        <h4>${d.name}</h4>
        <p><strong>Type:</strong> ${d.type}</p>
        <p><strong>Path:</strong> ${d.path}</p>
        <p><strong>Lines:</strong> ${d.lines.toLocaleString()}</p>
        <p><strong>Dependencies:</strong> ${d.dependencies.length}</p>
        <p><strong>Exports:</strong> ${d.exports.length}</p>
        ${d.apiEndpoints.length ? `<p><strong>Endpoints:</strong></p>${d.apiEndpoints.map(e => `<span class="badge">${e.method} ${e.path}</span>`).join('')}` : ''}
      `;
      tooltip.style.left = (event.pageX + 10) + 'px';
      tooltip.style.top = (event.pageY + 10) + 'px';
      tooltip.classList.add('show');
    }
    
    function hideTooltip() {
      document.getElementById('tooltip').classList.remove('show');
    }
    
    function showNodeDetails(node) {
      console.log('Selected node:', node);
      // Could expand to show in sidebar
    }
    
    function updateStats() {
      document.getElementById('stat-files').textContent = graphData.metadata.totalFiles;
      document.getElementById('stat-routes').textContent = graphData.metadata.routes;
      document.getElementById('stat-apis').textContent = graphData.metadata.apiEndpoints;
      document.getElementById('stat-components').textContent = graphData.metadata.components;
      document.getElementById('stat-services').textContent = graphData.metadata.services;
      document.getElementById('stat-nodes').textContent = Object.keys(graphData.nodes).length;
      document.getElementById('stat-edges').textContent = graphData.edges.length;
      document.getElementById('stat-errors').textContent = graphData.errors.length;
      document.getElementById('stat-warnings').textContent = graphData.warnings.length;
    }
    
    function initializeFeaturePills() {
      const container = document.getElementById('feature-pills');
      Object.entries(graphData.features).forEach(([id, feature]) => {
        const pill = document.createElement('div');
        pill.className = 'feature-pill';
        pill.textContent = feature.name;
        pill.onclick = () => focusFeature(id, pill);
        container.appendChild(pill);
      });
    }
    
    function focusFeature(featureId, pill) {
      selectedFeature = selectedFeature === featureId ? null : featureId;
      
      document.querySelectorAll('.feature-pill').forEach(p => p.classList.remove('active'));
      if (selectedFeature) {
        pill.classList.add('active');
      }
      
      const svg = d3.select('#graph');
      const data = svg.node().__data__;
      
      if (selectedFeature) {
        const featureNodes = new Set(graphData.features[featureId].nodes);
        
        data.node
          .classed('selected', false)
          .classed('dimmed', d => !featureNodes.has(d.id));
        
        data.link
          .classed('highlighted', l => featureNodes.has(l.source.id) && featureNodes.has(l.target.id))
          .classed('dimmed', l => !featureNodes.has(l.source.id) && !featureNodes.has(l.target.id));
      } else {
        resetView();
      }
    }
    
    function resetView() {
      selectedNode = null;
      selectedFeature = null;
      
      document.querySelectorAll('.feature-pill').forEach(p => p.classList.remove('active'));
      
      const svg = d3.select('#graph');
      const data = svg.node().__data__;
      
      data.node
        .classed('selected', false)
        .classed('dimmed', false);
      
      data.link
        .classed('highlighted', false)
        .classed('dimmed', false);
      
      data.label
        .classed('highlighted', false);
    }
    
    // Event listeners
    document.getElementById('reset-view').onclick = resetView;
    
    document.getElementById('search').oninput = (e) => {
      const query = e.target.value.toLowerCase();
      if (!query) {
        resetView();
        return;
      }
      
      const svg = d3.select('#graph');
      const data = svg.node().__data__;
      
      data.node
        .classed('dimmed', d => !d.name.toLowerCase().includes(query) && !d.path.toLowerCase().includes(query));
    };
    
    document.getElementById('filter-type').onchange = (e) => {
      const type = e.target.value;
      if (type === 'all') {
        resetView();
        return;
      }
      
      const svg = d3.select('#graph');
      const data = svg.node().__data__;
      
      data.node
        .classed('dimmed', d => d.type !== type);
    };
    
    document.getElementById('trace-deps').onclick = () => {
      if (!selectedNode) {
        alert('Select a node first by clicking on it');
        return;
      }
      
      const deps = new Set([selectedNode.id]);
      const queue = [selectedNode.id];
      
      while (queue.length) {
        const current = queue.shift();
        links.forEach(l => {
          if (l.source.id === current && !deps.has(l.target.id)) {
            deps.add(l.target.id);
            queue.push(l.target.id);
          }
        });
      }
      
      const svg = d3.select('#graph');
      const data = svg.node().__data__;
      
      data.node
        .classed('dimmed', d => !deps.has(d.id));
      
      data.link
        .classed('highlighted', l => deps.has(l.source.id) && deps.has(l.target.id))
        .classed('dimmed', l => !deps.has(l.source.id) || !deps.has(l.target.id));
    };
  </script>
</body>
</html>
